name: weatherflow

services:
  mongo:
    image: mongo:7
    container_name: weatherflow-mongo
    ports:
      - '27017:27017'
    volumes:
      - weatherflow-mongo-data:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: weatherflow-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-weatherflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-weatherflow}
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  api:
    container_name: weatherflow-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/weatherflow}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET for local API auth}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174,http://localhost:8080}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notifications:3001}
      INGESTION_SYSTEM_TOKEN: ${INGESTION_SYSTEM_TOKEN:?Set INGESTION_SYSTEM_TOKEN for internal ingestion calls}
      INGESTION_SERVICE_URL: ${INGESTION_SERVICE_URL:-http://ingestion:3002}
      INGESTION_TIMEOUT_MS: ${INGESTION_TIMEOUT_MS:-5000}
      INGESTION_CONCURRENCY_LIMIT: ${INGESTION_CONCURRENCY_LIMIT:-10}
      INGESTION_BREAKER_FAILURE_THRESHOLD: ${INGESTION_BREAKER_FAILURE_THRESHOLD:-3}
      INGESTION_BREAKER_OPEN_MS: ${INGESTION_BREAKER_OPEN_MS:-30000}
      INGESTION_RETRY_ATTEMPTS: ${INGESTION_RETRY_ATTEMPTS:-1}
      INGESTION_RETRY_BASE_DELAY_MS: ${INGESTION_RETRY_BASE_DELAY_MS:-100}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://weatherflow:weatherflow@rabbitmq:5672}
      RABBITMQ_ALERT_EXCHANGE: ${RABBITMQ_ALERT_EXCHANGE:-weatherflow.alerts}
      RABBITMQ_ALERT_ROUTING_KEY: ${RABBITMQ_ALERT_ROUTING_KEY:-alerts.climate.detected}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  notifications:
    container_name: weatherflow-notifications
    build:
      context: .
      dockerfile: apps/notifications/Dockerfile
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      NOTIFICATIONS_PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/weatherflow}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET for local Notification service auth}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://weatherflow:weatherflow@rabbitmq:5672}
      RABBITMQ_ALERT_EXCHANGE: ${RABBITMQ_ALERT_EXCHANGE:-weatherflow.alerts}
      RABBITMQ_ALERT_QUEUE: ${RABBITMQ_ALERT_QUEUE:-weatherflow.notifications.alerts}
      RABBITMQ_ALERT_ROUTING_KEY: ${RABBITMQ_ALERT_ROUTING_KEY:-alerts.climate.detected}
      NOTIFICATION_DELIVERY_MODE: ${NOTIFICATION_DELIVERY_MODE:-log}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3001/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ingestion:
    container_name: weatherflow-ingestion
    build:
      context: .
      dockerfile: apps/ingestion/Dockerfile
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: production
      INGESTION_PORT: 3002
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
      OWM_API_KEY: ${OWM_API_KEY:?Set OWM_API_KEY for OpenWeather ingestion}
      OWM_BASE_URL: ${OWM_BASE_URL:-https://api.openweathermap.org}
      OWM_TIMEOUT_MS: ${OWM_TIMEOUT_MS:-10000}
      OWM_CACHE_TTL_MS: ${OWM_CACHE_TTL_MS:-300000}
      OWM_BREAKER_FAILURE_THRESHOLD: ${OWM_BREAKER_FAILURE_THRESHOLD:-3}
      OWM_BREAKER_OPEN_MS: ${OWM_BREAKER_OPEN_MS:-30000}
      API_BASE_URL: ${API_BASE_URL:-http://api:3000}
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-10000}
      API_BREAKER_FAILURE_THRESHOLD: ${API_BREAKER_FAILURE_THRESHOLD:-3}
      API_BREAKER_OPEN_MS: ${API_BREAKER_OPEN_MS:-30000}
      API_RETRY_ATTEMPTS: ${API_RETRY_ATTEMPTS:-2}
      API_RETRY_BASE_DELAY_MS: ${API_RETRY_BASE_DELAY_MS:-250}
      INGESTION_SYSTEM_TOKEN: ${INGESTION_SYSTEM_TOKEN:?Set INGESTION_SYSTEM_TOKEN for internal ingestion calls}
      INGESTION_CRON: ${INGESTION_CRON:-*/10 * * * *}
      OWM_CONCURRENCY_LIMIT: ${OWM_CONCURRENCY_LIMIT:-3}
      API_CONCURRENCY_LIMIT: ${API_CONCURRENCY_LIMIT:-3}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3002/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    container_name: weatherflow-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000
        VITE_API_NOTIFICATIONS_BASE_URL: http://localhost:3001
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # --- Observability stack (opt-in): docker compose --profile observability up ---
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: weatherflow-prometheus
    profiles: ['observability']
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - weatherflow-prometheus-data:/prometheus
    ports:
      - '9090:9090'
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    container_name: weatherflow-loki
    profiles: ['observability']
    command: ['-config.file=/etc/loki/loki-config.yml']
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - weatherflow-loki-data:/loki
    ports:
      - '3100:3100'
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    container_name: weatherflow-promtail
    profiles: ['observability']
    command: ['-config.file=/etc/promtail/promtail-config.yml']
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: weatherflow-grafana
    profiles: ['observability']
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - weatherflow-grafana-data:/var/lib/grafana
    ports:
      - '3300:3000'
    depends_on:
      - prometheus
      - loki
      - jaeger
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: weatherflow-jaeger
    profiles: ['observability']
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'
      - '4317:4317'
      - '4318:4318'
    restart: unless-stopped

volumes:
  weatherflow-mongo-data:
  weatherflow-prometheus-data:
  weatherflow-loki-data:
  weatherflow-grafana-data:
