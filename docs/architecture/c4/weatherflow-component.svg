<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">WeatherFlow notification component diagram</title>
  <desc id="desc">Component view showing Web UI, API service, RabbitMQ, Notification service, SSE endpoint, in-app adapter, Notification collection, and Telegram integration.</desc>
  <style>
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
    .service { fill: #eef6ff; stroke: #1d4ed8; }
    .store { fill: #f0fdf4; stroke: #15803d; }
    .queue { fill: #fff7ed; stroke: #c2410c; }
    .label { font: 14px Arial, sans-serif; fill: #0f172a; }
    .small { font: 12px Arial, sans-serif; fill: #334155; }
    .title { font: 18px Arial, sans-serif; font-weight: 700; fill: #0f172a; }
    .line { stroke: #475569; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    .dash { stroke-dasharray: 6 5; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
  </defs>

  <text x="40" y="38" class="title">WeatherFlow - Notification service component view</text>

  <rect x="40" y="80" width="180" height="84" class="box service" />
  <text x="58" y="112" class="label">Web UI</text>
  <text x="58" y="134" class="small">NotificationsContext</text>
  <text x="58" y="152" class="small">bell, toast, /notifications</text>

  <rect x="40" y="250" width="180" height="72" class="box service" />
  <text x="58" y="282" class="label">API service - apps/api</text>
  <text x="58" y="304" class="small">RabbitMqAlertPublisherAdapter</text>

  <rect x="290" y="70" width="620" height="570" class="box service" />
  <text x="314" y="104" class="title">Notification service - apps/notifications</text>

  <rect x="325" y="135" width="205" height="70" class="box" />
  <text x="342" y="165" class="label">NotificationsController</text>
  <text x="342" y="186" class="small">GET /notifications; PATCH read</text>

  <rect x="325" y="230" width="205" height="70" class="box" />
  <text x="342" y="260" class="label">NotificationStreamController</text>
  <text x="342" y="281" class="small">GET /notifications/stream (SSE)</text>

  <rect x="325" y="325" width="205" height="70" class="box" />
  <text x="342" y="355" class="label">NotificationPreferencesController</text>
  <text x="342" y="376" class="small">profiles, subscriptions, channels</text>

  <rect x="590" y="135" width="260" height="70" class="box" />
  <text x="608" y="165" class="label">RabbitMqClimateAlertConsumerAdapter</text>
  <text x="608" y="186" class="small">consume, validate, ack/nack</text>

  <rect x="590" y="230" width="260" height="78" class="box" />
  <text x="608" y="260" class="label">NotificationService</text>
  <text x="608" y="281" class="small">Filter subscribers by station + alert type</text>
  <text x="608" y="298" class="small">Resolve delivery targets</text>

  <rect x="590" y="335" width="260" height="70" class="box" />
  <text x="608" y="365" class="label">CompositeAlertNotifierAdapter</text>
  <text x="608" y="386" class="small">Log, Telegram adapters, InApp</text>

  <rect x="590" y="430" width="260" height="72" class="box" />
  <text x="608" y="460" class="label">InAppAlertNotifierAdapter</text>
  <text x="608" y="481" class="small">persist Notification + emit event</text>

  <rect x="325" y="525" width="205" height="70" class="box" />
  <text x="342" y="555" class="label">MongoNotificationRepository</text>
  <text x="342" y="576" class="small">history and idempotency</text>

  <rect x="590" y="525" width="260" height="70" class="box" />
  <text x="608" y="555" class="label">MongoNotificationProfileRepository</text>
  <text x="608" y="576" class="small">deliveryChannels.inApp</text>

  <rect x="970" y="135" width="170" height="70" class="box queue" />
  <text x="990" y="165" class="label">RabbitMQ</text>
  <text x="990" y="186" class="small">ClimateAlertDetectedMessage</text>

  <rect x="970" y="270" width="170" height="90" class="box store" />
  <text x="990" y="300" class="label">notifications collection</text>
  <text x="990" y="322" class="small">index userId+createdAt</text>
  <text x="990" y="340" class="small">unique userId+messageId</text>

  <rect x="970" y="430" width="170" height="84" class="box store" />
  <text x="990" y="460" class="label">user_notification_profiles</text>
  <text x="990" y="482" class="small">subscriptions</text>
  <text x="990" y="500" class="small">deliveryChannels.inApp</text>

  <rect x="970" y="570" width="170" height="70" class="box" />
  <text x="990" y="600" class="label">Telegram Bot API</text>
  <text x="990" y="622" class="small">external delivery</text>

  <path d="M220 122 H325" class="line" />
  <path d="M220 122 C265 122 270 265 325 265" class="line" />
  <path d="M220 286 H265 V360 H325" class="line" />
  <path d="M220 286 H970" class="line dash" />
  <path d="M970 170 H850" class="line" />
  <path d="M720 205 V230" class="line" />
  <path d="M720 308 V335" class="line" />
  <path d="M720 405 V430" class="line" />
  <path d="M590 466 H530 V560" class="line" />
  <path d="M850 466 H910 V315 H970" class="line" />
  <path d="M720 502 V525" class="line" />
  <path d="M850 560 H970" class="line" />
  <path d="M530 560 H590" class="line" />
  <path d="M720 405 C910 405 910 605 970 605" class="line" />
  <path d="M590 466 C525 466 515 265 530 265" class="line" />
</svg>
