<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">Climate alert to in-app delivery sequence</title>
  <desc id="desc">A climate alert is persisted as a Notification and streamed to the authenticated browser through SSE.</desc>
  <rect width="960" height="220" fill="#ffffff"/>
  <text x="24" y="36" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Climate alert to in-app delivery</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#0f172a">
    <rect x="24" y="70" width="120" height="44" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
    <text x="45" y="96">Web browser</text>
    <rect x="180" y="70" width="140" height="44" rx="6" fill="#fef7e0" stroke="#f29900"/>
    <text x="203" y="96">SSE stream</text>
    <rect x="356" y="70" width="120" height="44" rx="6" fill="#fce8e6" stroke="#d93025"/>
    <text x="387" y="96">RabbitMQ</text>
    <rect x="512" y="70" width="148" height="44" rx="6" fill="#e6f4ea" stroke="#188038"/>
    <text x="533" y="96">NotificationService</text>
    <rect x="696" y="70" width="124" height="44" rx="6" fill="#fef7e0" stroke="#f29900"/>
    <text x="716" y="96">Mongo history</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M144 92 H180"/>
    <path d="M476 92 H512"/>
    <path d="M660 92 H696"/>
    <path d="M696 125 C520 176 340 176 180 125"/>
  </g>
  <text x="184" y="142" font-family="Arial, sans-serif" font-size="12" fill="#475569">event: notification, event: ping every 25s</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
