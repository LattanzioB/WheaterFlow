<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">WeatherFlow MongoDB database diagram</title>
  <desc id="desc">Entity relationship style diagram for the users, weather_stations, and measurements MongoDB collections used by WeatherFlow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#355070" />
    </marker>
    <style>
      .bg { fill: #f7f4ea; }
      .card { fill: #fffdf7; stroke: #355070; stroke-width: 2; rx: 18; ry: 18; }
      .header-users { fill: #355070; }
      .header-stations { fill: #588157; }
      .header-measurements { fill: #bc6c25; }
      .header-note { fill: #6d597a; }
      .title { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .section-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #1f2933; }
      .body { font: 16px 'Consolas', 'Courier New', monospace; fill: #243b53; }
      .small { font: 15px 'Segoe UI', Arial, sans-serif; fill: #243b53; }
      .line { stroke: #355070; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .label { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #355070; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="980" />
  <text x="700" y="54" text-anchor="middle" class="section-title">WeatherFlow MongoDB Persistence Diagram</text>
  <text x="700" y="82" text-anchor="middle" class="small">Collections, nested documents, indexes, and ID-based references</text>

  <rect class="card" x="40" y="120" width="390" height="560" />
  <rect class="header-users" x="40" y="120" width="390" height="58" rx="18" ry="18" />
  <rect x="40" y="160" width="390" height="18" fill="#355070" />
  <text x="68" y="156" class="title">users</text>
  <text x="68" y="214" class="section-title">Fields</text>
  <text x="68" y="246" class="body">_id: string (PK)</text>
  <text x="68" y="274" class="body">name: string</text>
  <text x="68" y="302" class="body">lastName: string</text>
  <text x="68" y="330" class="body">email: string</text>
  <text x="68" y="358" class="body">passwordHash: string</text>
  <text x="68" y="386" class="body">notificationPreferences[]:</text>
  <text x="96" y="414" class="body">stationId: string</text>
  <text x="96" y="442" class="body">alertTypes: AlertType[]</text>
  <text x="68" y="470" class="body">deliveryChannels.telegram.chatId:</text>
  <text x="96" y="498" class="body">string | null</text>
  <text x="68" y="526" class="body">role: UserRole</text>
  <text x="68" y="554" class="body">createdAt: Date</text>
  <text x="68" y="602" class="section-title">Indexes</text>
  <text x="68" y="634" class="body">unique(email)</text>
  <text x="68" y="662" class="body">notificationPreferences.stationId</text>

  <rect class="card" x="505" y="120" width="390" height="510" />
  <rect class="header-stations" x="505" y="120" width="390" height="58" rx="18" ry="18" />
  <rect x="505" y="160" width="390" height="18" fill="#588157" />
  <text x="533" y="156" class="title">weather_stations</text>
  <text x="533" y="214" class="section-title">Fields</text>
  <text x="533" y="246" class="body">_id: string (PK)</text>
  <text x="533" y="274" class="body">name: string</text>
  <text x="533" y="302" class="body">location.latitude: number</text>
  <text x="533" y="330" class="body">location.longitude: number</text>
  <text x="533" y="358" class="body">sensorModel: string</text>
  <text x="533" y="386" class="body">status: StationStatus</text>
  <text x="533" y="414" class="body">ownerId: string</text>
  <text x="533" y="442" class="body">alertSettings.extremeHeat: boolean</text>
  <text x="533" y="470" class="body">alertSettings.frost: boolean</text>
  <text x="533" y="498" class="body">alertSettings.storm: boolean</text>
  <text x="533" y="526" class="body">alertSettings.criticalHumidity:</text>
  <text x="561" y="554" class="body">boolean</text>
  <text x="533" y="582" class="body">createdAt: Date</text>
  <text x="533" y="602" class="section-title">Indexes</text>
  <text x="533" y="634" class="body">ownerId</text>

  <rect class="card" x="970" y="260" width="390" height="370" />
  <rect class="header-measurements" x="970" y="260" width="390" height="58" rx="18" ry="18" />
  <rect x="970" y="300" width="390" height="18" fill="#bc6c25" />
  <text x="998" y="296" class="title">measurements</text>
  <text x="998" y="354" class="section-title">Fields</text>
  <text x="998" y="386" class="body">_id: string (PK)</text>
  <text x="998" y="414" class="body">stationId: string</text>
  <text x="998" y="442" class="body">temperature: number</text>
  <text x="998" y="470" class="body">humidity: number</text>
  <text x="998" y="498" class="body">pressure: number</text>
  <text x="998" y="526" class="body">reportedAt: Date</text>
  <text x="998" y="554" class="body">alertStatus: boolean</text>
  <text x="998" y="582" class="body">alertType: AlertType</text>
  <text x="998" y="610" class="section-title">Indexes</text>
  <text x="998" y="642" class="body">(stationId, reportedAt desc)</text>
  <text x="998" y="670" class="body">alertStatus</text>

  <rect class="card" x="120" y="735" width="760" height="170" />
  <rect class="header-note" x="120" y="735" width="760" height="52" rx="18" ry="18" />
  <rect x="120" y="769" width="760" height="18" fill="#6d597a" />
  <text x="148" y="770" class="title">Preference / Delivery Split</text>
  <text x="148" y="820" class="small">`notificationPreferences` captures alert intent per station and alert type.</text>
  <text x="148" y="850" class="small">`deliveryChannels` captures how notifications are delivered, currently via Telegram chat ID.</text>
  <text x="148" y="880" class="small">All cross-collection relationships are stored as IDs; station and measurement documents are not embedded.</text>

  <path class="line" d="M430 300 C470 300, 470 300, 505 300" />
  <text x="458" y="286" class="label">ownerId -&gt; users._id</text>

  <path class="line" d="M895 430 C935 430, 935 430, 970 430" />
  <text x="913" y="416" class="label">stationId -&gt; weather_stations._id</text>

  <path class="line" d="M430 420 C468 420, 468 520, 505 520" />
  <text x="310" y="402" class="label">notificationPreferences[].stationId</text>
</svg>
