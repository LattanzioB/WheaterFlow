global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: weatherflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']
        labels:
          service: api

  - job_name: weatherflow-notifications
    metrics_path: /metrics
    static_configs:
      - targets: ['notifications:3001']
        labels:
          service: notifications

  - job_name: weatherflow-ingestion
    metrics_path: /metrics
    static_configs:
      - targets: ['ingestion:3002']
        labels:
          service: ingestion

  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: cadvisor
