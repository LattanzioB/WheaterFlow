groups:
  - name: weatherflow-operational
    interval: 30s
    rules:
      - alert: WeatherFlowServiceDown
        expr: up{job=~"weatherflow-api|weatherflow-notifications|weatherflow-ingestion"} == 0
        for: 1m
        labels:
          severity: critical
          team: weatherflow
        annotations:
          summary: "WeatherFlow service is down"
          description: "{{ $labels.job }} has not been scrapeable for more than 1 minute."

      - alert: WeatherFlowIngestionStopped
        expr: sum(increase(weatherflow_ingestion_cycles_total{trigger="scheduled"}[15m])) < 1
        for: 5m
        labels:
          severity: warning
          team: weatherflow
        annotations:
          summary: "Scheduled ingestion has stopped"
          description: "No scheduled ingestion cycle was observed in the last 15 minutes."

      - alert: WeatherFlowOpenWeatherErrorsHigh
        expr: |
          (
            sum(rate(weatherflow_owm_failures_total[5m]))
            /
            clamp_min(sum(rate(weatherflow_owm_requests_total{outcome=~"success|failure|bulkhead_rejected|circuit_open"}[5m])), 1)
          ) > 0.25
        for: 5m
        labels:
          severity: warning
          team: weatherflow
        annotations:
          summary: "OpenWeather error ratio is high"
          description: "More than 25% of recent OpenWeather boundary attempts are failing or rejected."

      - alert: WeatherFlowHttpP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (job, route, le) (
              rate(weatherflow_http_server_request_duration_seconds_bucket[5m])
            )
          ) > 1
        for: 5m
        labels:
          severity: warning
          team: weatherflow
        annotations:
          summary: "HTTP p95 latency is high"
          description: "{{ $labels.job }} {{ $labels.route }} p95 latency has been above 1 second for 5 minutes."
