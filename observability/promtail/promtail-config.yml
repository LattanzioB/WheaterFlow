server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Tails the JSON logs written by every Docker container and forwards the
  # WeatherFlow services' structured lines to Loki. The `service` label comes
  # from the application log payload so Grafana can filter per service.
  - job_name: docker-containers
    static_configs:
      - targets: ['localhost']
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
      - json:
          source: output
          expressions:
            service: service
            level: level
            correlationId: correlationId
            traceId: traceId
      - labels:
          service:
          level:
          stream:
      - output:
          source: output
